[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.1",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.0",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"
