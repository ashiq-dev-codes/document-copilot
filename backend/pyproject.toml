[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.1",
    "httpx==0.28.1",
    "pgvector==0.5.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.0",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn==0.54.0",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ruff==0.17.1",
]

[tool.ruff.lint.isort]
# Our migrations folder is also named alembic/; the import means the installed package.
known-third-party = ["alembic"]
